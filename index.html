<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="An elastic particle speed control with rolling, spring-soft digits."
    />
    <title>Elastic Slider</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #171717;
        font-family: Arial, Helvetica, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .slider-wrap {
        width: min(360px, calc(100vw - 80px));
        position: relative;
      }
      .slider {
        --radius: 24px;
        --fill: 32%;
        --grip: 32%;
        overflow: hidden;
        position: relative;
        height: 68px;
        width: 100%;
        border-radius: 24px;
        background: #f0f0f0;
        isolation: isolate;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
        will-change: transform;
        outline: none;
      }
      .slider:active {
        cursor: grabbing;
      }
      .slider:focus-visible {
        outline: 2px solid #999;
        outline-offset: 7px;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 100%;
        border-radius: var(--radius);
        background: #000;
        transform: translateX(calc(var(--fill) - 100%));
        will-change: transform;
      }
      .labels {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        font-size: 20px;
        letter-spacing: -0.45px;
        pointer-events: none;
      }
      .labels .value {
        color: #747474;
        font-variant-numeric: tabular-nums;
      }
      .labels.inverted {
        color: white;
        clip-path: inset(
          0 calc(100% - var(--fill)) 0 calc(var(--fill) - 100%) round
            var(--radius)
        );
        will-change: clip-path;
      }
      .labels.inverted .value {
        color: #a3a3a3;
      }
      .grip {
        position: absolute;
        left: clamp(17px, calc(var(--grip) - 16px), calc(100% - 19px));
        top: 22px;
        width: 5px;
        height: 24px;
        border-radius: 4px;
        background: #fff;
        opacity: 0.9;
        pointer-events: none;
        transition: opacity 0.15s;
      }
      .slider[data-low="true"] .grip {
        background: #b7b7b7;
      }
      .slider[data-high="true"] .grip {
        opacity: 0.4;
      }
      .hint {
        -webkit-user-select: none;
        user-select: none;
        position: absolute;
        top: calc(100% + 24px);
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: #8a9294;
        line-height: 1.7;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .slider-wrap:focus-within .hint {
        opacity: 1;
      }
      @media (max-width: 480px) {
        .slider {
          --radius: 21px;
          height: 60px;
          border-radius: 21px;
        }
        .fill {
          border-radius: 21px;
        }
        .labels {
          font-size: 18px;
          padding: 0 19px;
        }
        .grip {
          top: 19px;
          height: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hint,
        .grip {
          transition: none;
        }
      }
      /* Precision readout: display changes only; pointer coordinates remain unchanged. */
      .fill,
      .labels.inverted {
        transition: opacity 0.16s ease;
      }
      .labels > span:first-child {
        transition: transform 0.2s ease;
      }
      .precision {
        position: absolute;
        left: 22px;
        top: 50%;
        display: flex;
        gap: 0;
        align-items: center;
        transform: translateY(-50%) scaleX(0.5);
        transform-origin: left center;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.16s ease,
          transform 0.2s ease;
      }
      .precision i {
        display: grid;
        place-items: center;
        width: 8px;
        height: 36px;
        cursor: pointer;
      }
      .precision i::after {
        content: "";
        width: 4px;
        height: 18px;
        border-radius: 2px;
        background: #d1d1d1;
        transition: background-color 0.1s ease;
      }
      .precision i[data-active="true"]::after {
        background: #343434;
      }
      .slider[data-precision="true"]:not([data-dragging="true"]) .precision {
        pointer-events: auto;
      }
      .precision i:hover::after {
        background: #777;
      }
      .slider[data-precision="true"] .fill,
      .slider[data-precision="true"] .labels.inverted,
      .slider[data-precision="true"] .grip {
        opacity: 0;
      }
      .slider[data-precision="true"] .precision {
        opacity: 1;
        transform: translateY(-50%) scaleX(1);
      }
      .slider[data-precision="true"] .labels > span:first-child {
        transform: translateX(50px);
      }
      @media (max-width: 480px) {
        .precision {
          left: 19px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fill,
        .labels.inverted,
        .labels > span:first-child,
        .precision,
        .precision i {
          transition: none;
        }
      }
      /* A quiet atmospheric field; the slider stays opaque and readable. */
      body {
        background: #fbfcfc;
      }
      #particles {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.32s ease;
      }
      #particles[data-hidden="true"] {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #particles {
          transition: none;
        }
      }
      main {
        position: relative;
        z-index: 1;
      }
      .slider {
        background: rgba(236, 239, 239, 0.96);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.8) inset,
          0 10px 40px -25px rgba(30, 65, 75, 0.16);
      }
      .labels .value {
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0;
        white-space: nowrap;
        line-height: 1.4;
        letter-spacing: -0.45px;
        min-width: 4.1em;
        perspective: 240px;
      }
      .digit {
        position: relative;
        display: inline-block;
        width: 0.56em;
        height: 1.4em;
      }
      .glyph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        transform-origin: 50% 65%;
        backface-visibility: hidden;
      }
      .unit {
        display: inline-block;
        margin-left: 0.12em;
        font-size: 0.82em;
        opacity: 0.85;
      }
      @media (hover: hover) {
        .slider-wrap:hover .hint {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .precision i::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="particles" aria-hidden="true"></canvas>
    <main>
      <div class="slider-wrap">
        <div
          class="slider"
          role="slider"
          tabindex="0"
          aria-label="Particle speed"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="32"
          aria-valuetext="32 percent"
        >
          <div class="fill"></div>
          <div class="labels">
            <span>Speed</span><span class="value">32%</span>
          </div>
          <div class="labels inverted" aria-hidden="true">
            <span>Speed</span><span class="value">32%</span>
          </div>
          <div class="grip"></div>
          <div class="precision" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <div class="hint">
          Drag or scroll · Tap a bar for 1–5% · PgUp/Down for 10%
        </div>
      </div>
    </main>

    <script>
      /* Keep the fill at full width and translate it behind the clipped track.
   This preserves its corner radius even at very low values.
   The two text layers are identical. Clipping the white layer to the fill
   keeps both labels legible while the black edge passes underneath them. */
      const slider = document.querySelector(".slider");
      const values = slider.querySelectorAll(".value");
      const indicators = slider.querySelectorAll(".precision i");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      let value = 32,
        visual = 32,
        velocity = 0,
        stretch = 0,
        stretchVelocity = 0,
        targetStretch = 0;
      let dragging = false,
        pointerId = null,
        bounds,
        frame = 0;
      const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
      function draw() {
        slider.style.setProperty("--fill", visual + "%");
        slider.style.setProperty("--grip", visual + "%");
        const s = Math.abs(stretch);
        slider.style.transformOrigin =
          stretch < 0 ? "right center" : "left center";
        slider.style.transform = `scale(${1 + s / 360},${1 - s / 900})`;
        slider.dataset.low = visual < 8;
        slider.dataset.high = visual > 94;
      }
      // Only changed digit columns roll; both color layers use the same timing.
      const columns = Array.from(values, (el) => {
        el.textContent = "";
        el.setAttribute("aria-hidden", "true");
        const slots = Array.from({ length: 3 }, () => {
          const slot = document.createElement("span");
          slot.className = "digit";
          el.append(slot);
          return slot;
        });
        const unit = document.createElement("span");
        unit.className = "unit";
        unit.textContent = "%";
        el.append(unit);
        return slots;
      });
      let displayedValue = null;
      function renderValue(next) {
        const previous = displayedValue;
        const chars = String(next).padStart(3, " ");
        const oldChars =
          previous === null ? "   " : String(previous).padStart(3, " ");
        const direction = previous === null || next >= previous ? 1 : -1;
        const now = document.timeline.currentTime;
        columns.forEach((slots) =>
          slots.forEach((slot, index) => {
            if (previous !== null && chars[index] === oldChars[index]) return;
            slot
              .getAnimations({ subtree: true })
              .forEach((animation) => animation.cancel());
            slot.replaceChildren();
            const glyph = document.createElement("span");
            glyph.className = "glyph";
            glyph.textContent = chars[index];
            slot.append(glyph);
            if (previous === null || reduced.matches) return;
            if (oldChars[index] !== " ") {
              const ghost = document.createElement("span");
              ghost.className = "glyph";
              ghost.textContent = oldChars[index];
              slot.prepend(ghost);
              const outgoing = ghost.animate(
                [
                  {
                    transform: "translateY(0) scale(1)",
                    filter: "blur(0px)",
                    opacity: 1,
                  },
                  {
                    transform: `translateY(${-direction * 14}px) scale(.94,1.08)`,
                    filter: "blur(3px)",
                    opacity: 0,
                  },
                ],
                {
                  duration: 180,
                  easing: "cubic-bezier(.3,0,.7,1)",
                  fill: "forwards",
                },
              );
              outgoing.startTime = now;
              outgoing.onfinish = () => ghost.remove();
            }
            const incoming = glyph.animate(
              [
                {
                  transform: `translateY(${direction * 15}px) scale(.94,1.1)`,
                  filter: "blur(3px)",
                  opacity: 0,
                  offset: 0,
                },
                {
                  transform: `translateY(${-direction * 3.5}px) scale(1.025,.97)`,
                  filter: "blur(0px)",
                  opacity: 1,
                  offset: 0.48,
                },
                {
                  transform: `translateY(${direction * 1.2}px) scale(.995,1.01)`,
                  filter: "blur(0px)",
                  opacity: 1,
                  offset: 0.73,
                },
                {
                  transform: "translateY(0) scale(1)",
                  filter: "blur(0px)",
                  opacity: 1,
                  offset: 1,
                },
              ],
              { duration: 430, easing: "ease-out" },
            );
            incoming.startTime = now;
          }),
        );
        displayedValue = next;
      }
      function updateValue(next) {
        const old = value;
        value = clamp(Math.round(next), 0, 100);
        renderValue(value);
        particleImpulse = Math.min(
          1,
          particleImpulse + Math.abs(value - old) * 0.035,
        );
        slider.dataset.precision = value <= 5;
        indicators.forEach((indicator, index) => {
          indicator.dataset.active = index < value;
          indicator.title = index + 1 + "%";
        });
        slider.setAttribute("aria-valuenow", value);
        slider.setAttribute("aria-valuetext", value + " percent");
        canvas.dataset.hidden = value <= 5;
        if (value <= 5) {
          particleSpeed = value;
          particleImpulse = 0;
          stopParticles();
        } else if (reduced.matches) paintParticles(0);
        else startParticles();
      }
      let previousTime = 0;
      function animate(time) {
        const dt = Math.min((time - previousTime) / 16.667 || 1, 2);
        previousTime = time;
        if (reduced.matches) {
          visual = value;
          stretch = 0;
          velocity = stretchVelocity = 0;
        } else {
          velocity += (value - visual) * 0.2 * dt;
          velocity *= Math.pow(0.64, dt);
          visual += velocity * dt;
          stretchVelocity += (targetStretch - stretch) * 0.18 * dt;
          stretchVelocity *= Math.pow(0.62, dt);
          stretch += stretchVelocity * dt;
          visual = clamp(visual, 0, 100);
        }
        draw();
        if (
          Math.abs(value - visual) > 0.005 ||
          Math.abs(velocity) > 0.005 ||
          Math.abs(targetStretch - stretch) > 0.005 ||
          Math.abs(stretchVelocity) > 0.005
        ) {
          frame = requestAnimationFrame(animate);
        } else {
          visual = value;
          stretch = targetStretch;
          draw();
          frame = 0;
          previousTime = 0;
        }
      }
      function schedule() {
        if (!frame) frame = requestAnimationFrame(animate);
      }
      function move(x) {
        const raw = (x - bounds.left) / bounds.width;
        updateValue(raw * 100);
        // A saturating rubber-band curve limits the stretch outside the track.
        const overflow =
          raw < 0 ? raw * bounds.width : raw > 1 ? (raw - 1) * bounds.width : 0;
        targetStretch =
          Math.sign(overflow) * 32 * (1 - Math.exp(-Math.abs(overflow) / 100));
        schedule();
      }
      // A press on a precision indicator is a tap candidate until it moves.
      // Capturing the pointer keeps an existing drag continuous through low values.
      let tapCandidate = null;
      slider.addEventListener("pointerdown", (e) => {
        if (e.button !== 0 || pointerId !== null) return;
        bounds = slider.getBoundingClientRect();
        pointerId = e.pointerId;
        const index = Array.from(indicators).indexOf(e.target);
        tapCandidate =
          value <= 5 && index >= 0
            ? { value: index + 1, x: e.clientX, y: e.clientY }
            : null;
        dragging = !tapCandidate;
        slider.dataset.dragging = dragging;
        slider.setPointerCapture(pointerId);
        slider.focus({ preventScroll: true });
        if (dragging) move(e.clientX);
      });
      slider.addEventListener("pointermove", (e) => {
        if (e.pointerId !== pointerId) return;
        if (
          tapCandidate &&
          Math.hypot(e.clientX - tapCandidate.x, e.clientY - tapCandidate.y) > 4
        ) {
          tapCandidate = null;
          dragging = true;
          slider.dataset.dragging = true;
        }
        if (dragging) move(e.clientX);
      });
      function release(e) {
        if (e.pointerId !== pointerId) return;
        if (e.type === "pointerup" && tapCandidate)
          updateValue(tapCandidate.value);
        tapCandidate = null;
        dragging = false;
        slider.dataset.dragging = false;
        pointerId = null;
        targetStretch = 0;
        schedule();
      }
      slider.addEventListener("pointerup", release);
      slider.addEventListener("pointercancel", release);
      slider.addEventListener("lostpointercapture", release);
      let wheelRemainder = 0,
        lastWheel = 0;
      slider.addEventListener(
        "wheel",
        (e) => {
          // Preserve browser pinch-to-zoom and do not compete with a captured drag.
          if (e.ctrlKey || pointerId !== null || !e.deltaY) return;
          e.preventDefault();
          const delta =
            e.deltaY *
            (e.deltaMode === 1
              ? 16
              : e.deltaMode === 2
                ? bounds?.height || 68
                : 1);
          if (
            e.timeStamp - lastWheel > 180 ||
            Math.sign(delta) !== Math.sign(wheelRemainder)
          )
            wheelRemainder = 0;
          lastWheel = e.timeStamp;
          wheelRemainder += delta;
          if (Math.abs(wheelRemainder) >= 40) {
            updateValue(value - Math.sign(wheelRemainder));
            wheelRemainder = 0;
            schedule();
          }
        },
        { passive: false },
      );
      slider.addEventListener("keydown", (e) => {
        const step = e.shiftKey ? 10 : 1;
        let next = value;
        switch (e.key) {
          case "ArrowRight":
          case "ArrowUp":
            next += step;
            break;
          case "ArrowLeft":
          case "ArrowDown":
            next -= step;
            break;
          case "Home":
            next = 0;
            break;
          case "End":
            next = 100;
            break;
          case "PageUp":
            next += 10;
            break;
          case "PageDown":
            next -= 10;
            break;
          default:
            return;
        }
        e.preventDefault();
        updateValue(next);
        schedule();
      });
      slider.addEventListener("dblclick", () => {
        updateValue(32);
        schedule();
      });
      // Canvas particles use elapsed seconds, so speed is independent of refresh rate.
      const canvas = document.querySelector("#particles");
      const ctx = canvas.getContext("2d");
      let fieldWidth = 0,
        fieldHeight = 0,
        particles = [],
        particleFrame = 0,
        lastParticleTime = 0;
      let particleSpeed = 32,
        particleImpulse = 0;
      function resizeField() {
        fieldWidth = innerWidth;
        fieldHeight = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(fieldWidth * dpr);
        canvas.height = Math.round(fieldHeight * dpr);
        ctx?.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(
          35,
          Math.min(110, Math.round((fieldWidth * fieldHeight) / 12000)),
        );
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * fieldWidth,
          y: Math.random() * fieldHeight,
          depth: 0.25 + Math.random() * 0.75,
          radius: 0.6 + Math.random() * 1.5,
          phase: Math.random() * Math.PI * 2,
        }));
        paintParticles(0);
      }
      function paintParticles(dt) {
        if (!ctx) return;
        ctx.clearRect(0, 0, fieldWidth, fieldHeight);
        const atmosphere = ctx.createRadialGradient(
          fieldWidth * 0.65,
          fieldHeight * 0.43,
          0,
          fieldWidth * 0.65,
          fieldHeight * 0.43,
          Math.max(fieldWidth, fieldHeight) * 0.7,
        );
        atmosphere.addColorStop(0, "rgba(203,226,226,.24)");
        atmosphere.addColorStop(0.5, "rgba(226,233,242,.12)");
        atmosphere.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = atmosphere;
        ctx.fillRect(0, 0, fieldWidth, fieldHeight);
        const speed = (particleSpeed / 100) ** 1.5 * 380;
        particles.forEach((p) => {
          p.x +=
            dt * speed * (0.3 + p.depth * 0.7) * (1 + particleImpulse * 0.4);
          if (p.x > fieldWidth + 35) {
            p.x = -35;
            p.y = Math.random() * fieldHeight;
          }
          const y = p.y + Math.sin(p.phase + p.x * 0.003) * 5;
          const trail = (particleSpeed / 100) ** 2 * 24 * p.depth;
          if (trail > 1) {
            const line = ctx.createLinearGradient(p.x - trail, y, p.x, y);
            line.addColorStop(0, "rgba(116,157,167,0)");
            line.addColorStop(1, `rgba(116,157,167,${0.12 * p.depth})`);
            ctx.strokeStyle = line;
            ctx.lineWidth = p.radius * 0.65;
            ctx.beginPath();
            ctx.moveTo(p.x - trail, y);
            ctx.lineTo(p.x, y);
            ctx.stroke();
          }
          ctx.fillStyle = `rgba(101,143,155,${0.12 + p.depth * 0.18})`;
          ctx.beginPath();
          ctx.arc(p.x, y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      function tickParticles(time) {
        particleFrame = 0;
        if (document.hidden || reduced.matches) {
          lastParticleTime = 0;
          return;
        }
        const dt = Math.min((time - lastParticleTime) / 1000 || 0, 0.04);
        lastParticleTime = time;
        particleSpeed += (value - particleSpeed) * (1 - Math.exp(-dt * 5));
        particleImpulse *= Math.exp(-dt * 3);
        paintParticles(dt);
        if (value > 0 || particleSpeed > 0.02 || particleImpulse > 0.01)
          particleFrame = requestAnimationFrame(tickParticles);
        else {
          particleSpeed = 0;
          lastParticleTime = 0;
        }
      }
      function startParticles() {
        if (
          ctx &&
          value > 5 &&
          !particleFrame &&
          !document.hidden &&
          !reduced.matches
        )
          particleFrame = requestAnimationFrame(tickParticles);
      }
      function stopParticles() {
        cancelAnimationFrame(particleFrame);
        particleFrame = 0;
        lastParticleTime = 0;
      }
      addEventListener("resize", resizeField);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopParticles();
        else startParticles();
      });
      reduced.addEventListener("change", () => {
        if (reduced.matches) {
          stopParticles();
          displayedValue = null;
          renderValue(value);
          paintParticles(0);
        } else startParticles();
      });
      resizeField();
      updateValue(value);
      draw();
    </script>
  </body>
</html>
